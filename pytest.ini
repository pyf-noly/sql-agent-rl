[pytest]
# 让 `import envs.xxx` 在仓库根目录直接可用（不依赖 PYTHONPATH）
pythonpath = .

# 把 pytest 的临时目录固定成仓库内的相对路径。
# 原来的 /tmp/sqlrl-pytest 是 WSL 写法：在 Windows 原生 Python 下会变成 E:\tmp\...，
# 目录不存在时所有用到 tmp_path 的测试直接 collection error（2026-11 踩到）。
# 用相对路径后 Windows / WSL 都能跑，也不再依赖系统临时目录（沙箱下常被拒）。
addopts = -q --basetemp=.pytest-run

testpaths = tests
